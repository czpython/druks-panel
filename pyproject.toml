[project]
name = "druks-panel"
version = "0.1.0"
description = "A durable decision panel built on Druks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paulo Alvarado Garcia" }]
keywords = ["agents", "decisions", "druks", "durable-execution", "workflows"]
requires-python = ">=3.11"
# Panel declares its screens with the Druks UI V1 contract, which landed after
# 0.4.0. Pin the exact Druks commit until that contract has a versioned release.
dependencies = [
    "druks @ git+https://github.com/czpython/druks.git@5743a1511ba8b5b4c1c8317c6678cdea678621ee",
]

[project.urls]
Documentation = "https://docs.druks.ai"
Issues = "https://github.com/czpython/druks-panel/issues"
Repository = "https://github.com/czpython/druks-panel"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.1",
]

[project.entry-points."druks.apps"]
panel = "druks_panel.app:Panel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["druks_panel"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated revisions are machine-written; don't hand-lint them.
extend-exclude = ["druks_panel/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pyright]
pythonVersion = "3.11"
include = ["druks_panel"]
typeCheckingMode = "standard"
